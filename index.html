<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulação 3D - Mapa de Calor Piso Piezoelétrico</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #2b2b2b; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white;
      background: rgba(0,0,0,0.8); padding: 12px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="info">
    <h3>FECART - Piso Piezoelétrico</h3>
    <p>O piso esquenta de cor conforme o acúmulo de passos:</p>
    <p>⚪ Sem tráfego ➔ 🟢 Pouco ➔ 🟡 Médio ➔ 🔴 Alto ➔ 🟣 Extremo</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. Configuração da Cena (Fundo Cinza)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b2b);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Criar o Piso Malhado
    const largura = 10, profundidade = 10;
    const segmentos = 60; // Resolução alta para transição suave
    const geometry = new THREE.PlaneGeometry(largura, profundidade, segmentos, segmentos);
    geometry.rotateX(-Math.PI / 2);

    const count = geometry.attributes.position.count;
    const colors = new Float32Array(count * 3);
    const intensidades = new Float32Array(count); 

    // Inicializar o piso com cinza escuro neutro
    for (let i = 0; i < count; i++) {
      colors[i * 3] = 0.15;     // R
      colors[i * 3 + 1] = 0.15; // G
      colors[i * 3 + 2] = 0.15; // B
      intensidades[i] = 0;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const materialPiso = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
    const piso = new THREE.Mesh(geometry, materialPiso);
    scene.add(piso);

    // Grid visual
    const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
    grid.position.y = 0.01;
    scene.add(grid);

    // 3. Criar os Pedestres
    const pedestres = [];
    const numPedestres = 6;

    for (let i = 0; i < numPedestres; i++) {
      const pGeo = new THREE.SphereGeometry(0.25, 16, 16);
      const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pedestre = new THREE.Mesh(pGeo, pMat);

      pedestre.position.set(
        (Math.random() - 0.5) * 8,
        0.25,
        (Math.random() - 0.5) * 8
      );

      scene.add(pedestre);
      pedestres.push({
        mesh: pedestre,
        dx: (Math.random() - 0.5) * 0.06,
        dz: (Math.random() - 0.5) * 0.06
      });
    }

    // 4. Lógica de Acúmulo de Calor: Verde -> Amarelo -> Vermelho -> Roxo
    const posAttribute = geometry.attributes.position;
    const colorAttribute = geometry.attributes.color;

    function atualizarMapaDeCalor() {
      pedestres.forEach(p => {
        const px = p.mesh.position.x;
        const pz = p.mesh.position.z;

        for (let i = 0; i < count; i++) {
          const vx = posAttribute.getX(i);
          const vz = posAttribute.getZ(i);

          const dist = Math.sqrt((vx - px) ** 2 + (vz - pz) ** 2);

          // Incrementa o acúmulo de passos apenas onde o pé toca
          if (dist < 0.6) {
            intensidades[i] = Math.min(intensidades[i] + (0.6 - dist) * 0.03, 1.0);
          }

          const val = intensidades[i];

          if (val > 0) {
            let r = 0.15, g = 0.15, b = 0.15;

            if (val <= 0.25) {
              // 1. Cinza -> Verde (Pouco fluxo)
              const factor = val / 0.25;
              r = 0.15 * (1 - factor);
              g = 0.15 + (0.85 * factor);
              b = 0.15 * (1 - factor);
            } else if (val <= 0.5) {
              // 2. Verde -> Amarelo (Fluxo médio)
              const factor = (val - 0.25) / 0.25;
              r = factor;
              g = 1.0;
              b = 0.0;
            } else if (val <= 0.75) {
              // 3. Amarelo -> Vermelho (Alto fluxo)
              const factor = (val - 0.5) / 0.25;
              r = 1.0;
              g = 1.0 - factor;
              b = 0.0;
            } else {
              // 4. Vermelho -> Roxo (Fluxo extremo/saturação)
              const factor = (val - 0.75) / 0.25;
              r = 1.0 - (0.5 * factor); // Vermelho reduz para escurecer o roxo
              g = 0.0;
              b = factor * 0.8;         // Azul sobe para formar roxo
            }

            colorAttribute.setXYZ(i, r, g, b);
          }
        }
      });

      colorAttribute.needsUpdate = true;
    }

    // 5. Loop de Animação
    function animate() {
      requestAnimationFrame(animate);

      pedestres.forEach(p => {
        p.mesh.position.x += p.dx;
        p.mesh.position.z += p.dz;

        if (Math.abs(p.mesh.position.x) > 4.2) p.dx *= -1;
        if (Math.abs(p.mesh.position.z) > 4.2) p.dz *= -1;
      });

      atualizarMapaDeCalor();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
