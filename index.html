<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Simulação 3D - Mapa de Calor Acumulado</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #2b2b2b; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white;
      background: rgba(0,0,0,0.8); padding: 12px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="info">
    <h3>FECART - Piso Piezoelétrico</h3>
    <p>Evolução por acúmulo de passadas no mesmo local:</p>
    <p>⚪ Sem tráfego ➔ 🟢 Pouco ➔ 🟡 Médio ➔ 🔴 Alto ➔ 🟣 Extremo</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // 1. Cena com fundo cinza
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b2b);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. Criar o Piso
    const largura = 10, profundidade = 10;
    const segmentos = 60;
    const geometry = new THREE.PlaneGeometry(largura, profundidade, segmentos, segmentos);
    geometry.rotateX(-Math.PI / 2);

    const count = geometry.attributes.position.count;
    const colors = new Float32Array(count * 3);
    const acumuladorPassos = new Float32Array(count); // Guarda a quantidade de vezes que pessoas passaram no local

    // Inicializar o piso em cinza escuro neutro
    for (let i = 0; i < count; i++) {
      colors[i * 3] = 0.15;     // Red
      colors[i * 3 + 1] = 0.15; // Green
      colors[i * 3 + 2] = 0.15; // Blue
      acumuladorPassos[i] = 0;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const materialPiso = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
    const piso = new THREE.Mesh(geometry, materialPiso);
    scene.add(piso);

    // Linhas do Grid
    const grid = new THREE.GridHelper(10, 10, 0x555555, 0x333333);
    grid.position.y = 0.01;
    scene.add(grid);

    // 3. Criar os Pedestres
    const pedestres = [];
    const numPedestres = 6;

    for (let i = 0; i < numPedestres; i++) {
      const pGeo = new THREE.SphereGeometry(0.25, 16, 16);
      const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pedestre = new THREE.Mesh(pGeo, pMat);

      pedestre.position.set(
        (Math.random() - 0.5) * 8,
        0.25,
        (Math.random() - 0.5) * 8
      );

      scene.add(pedestre);
      pedestres.push({
        mesh: pedestre,
        dx: (Math.random() - 0.5) * 0.06,
        dz: (Math.random() - 0.5) * 0.06
      });
    }

    // 4. Lógica de Progressão Conforme Mais Pessoas Passam
    const posAttribute = geometry.attributes.position;
    const colorAttribute = geometry.attributes.color;

    function atualizarMapaDeCalor() {
      pedestres.forEach(p => {
        const px = p.mesh.position.x;
        const pz = p.mesh.position.z;

        for (let i = 0; i < count; i++) {
          const vx = posAttribute.getX(i);
          const vz = posAttribute.getZ(i);

          const dist = Math.sqrt((vx - px) ** 2 + (vz - pz) ** 2);

          // Somar fluxo apenas no raio de toque
          if (dist < 0.5) {
            // Quanto mais perto do centro do pé, mais rápido acumula
            const pesoPasso = (0.5 - dist) * 0.015; 
            acumuladorPassos[i] = Math.min(acumuladorPassos[i] + pesoPasso, 1.0);
          }

          // Atualizar a cor com base no total acumulado de passadas
          const val = acumuladorPassos[i];

          if (val > 0) {
            let r = 0.15, g = 0.15, b = 0.15;

            if (val <= 0.25) {
              // Estágio 1: Cinza -> Verde (Primeiras pessoas passando)
              const t = val / 0.25;
              r = 0.15 * (1 - t);
              g = 0.15 + (0.85 * t);
              b = 0.15 * (1 - t);
            } else if (val <= 0.50) {
              // Estágio 2: Verde -> Amarelo (Tráfego moderado)
              const t = (val - 0.25) / 0.25;
              r = t;
              g = 1.0;
              b = 0.0;
            } else if (val <= 0.75) {
              // Estágio 3: Amarelo -> Vermelho (Tráfego alto)
              const t = (val - 0.50) / 0.25;
              r = 1.0;
              g = 1.0 - t;
              b = 0.0;
            } else {
              // Estágio 4: Vermelho -> Roxo (Várias pessoas passaram repetidamente)
              const t = (val - 0.75) / 0.25;
              r = 1.0 - (0.5 * t);
              g = 0.0;
              b = t * 0.8;
            }

            colorAttribute.setXYZ(i, r, g, b);
          }
        }
      });

      colorAttribute.needsUpdate = true;
    }

    // 5. Loop da Simulação
    function animate() {
      requestAnimationFrame(animate);

      pedestres.forEach(p => {
        p.mesh.position.x += p.dx;
        p.mesh.position.z += p.dz;

        if (Math.abs(p.mesh.position.x) > 4.2) p.dx *= -1;
        if (Math.abs(p.mesh.position.z) > 4.2) p.dz *= -1;
      });

      atualizarMapaDeCalor();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
